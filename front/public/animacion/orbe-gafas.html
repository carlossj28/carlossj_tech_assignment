<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rita - orbe con gafas</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:radial-gradient(circle at 50% 35%, #0f1426, #050507 70%);
         font-family:system-ui,sans-serif; color:#fff; }
  .call { display:flex; flex-direction:column; align-items:center; gap:10px; }
  #orb { width:420px; height:420px; }
  h1 { margin:0; font-size:22px; font-weight:600; }
  .status { margin:0; color:#aab; font-size:14px; min-height:1.2em; }
  .controls { margin-top:14px; display:flex; gap:8px; }
  .controls button { background:#14141b; color:#fff; border:1px solid #5cc8ff44; padding:9px 16px;
                     border-radius:999px; cursor:pointer; font-size:13px; }
  .controls button.on { background:#3d6bff; border-color:#3d6bff; }
</style>
</head>
<body>
<main class="call">
  <canvas id="orb" role="img" aria-label="Rita, asistente de voz"></canvas>
  <h1>Rita</h1>
  <p class="status" id="label">En línea</p>
  <div class="controls">
    <button data-s="idle" class="on">Reposo</button>
    <button data-s="listening">Escuchando</button>
    <button data-s="speaking">Hablando</button>
    <button data-s="thinking">Pensando</button>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const lerp = (a, b, k) => a + (b - a) * k, rand = (a, b) => a + Math.random() * (b - a);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgba = (c, a) => `rgba(${c.map(Math.round)},${a})`;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches ? .3 : 1;

const cv = $('orb'), ctx = cv.getContext('2d'), SIZE = 420, dpr = devicePixelRatio || 1;
cv.width = cv.height = SIZE * dpr; ctx.scale(dpr, dpr);
const C = SIZE / 2, R = 118;

// Paleta y comportamiento por estado (deep = fondo, mid = nubes, light = brillos)
const S = {
  idle:      { deep: '#1b3fd6', mid: '#5cc8ff', light: '#eaf6ff', glow: '#3d8bff', speed: .6,  deform: .015, think: 0 },
  listening: { deep: '#0a6cff', mid: '#6fe3ff', light: '#ffffff', glow: '#5cd6ff', speed: 1.1, deform: .03,  think: 0 },
  speaking:  { deep: '#2a4bff', mid: '#8fb4ff', light: '#ffffff', glow: '#6f8bff', speed: 1.4, deform: .05,  think: 0 },
  thinking:  { deep: '#3424a0', mid: '#8b7bff', light: '#f3d9ff', glow: '#8b7bff', speed: 2.4, deform: .02,  think: 1 },
};
const LABEL = { idle: 'En línea', listening: 'Te escucho…', speaking: 'Hablando…', thinking: 'Pensando…' };
const COLORS = ['deep', 'mid', 'light', 'glow'];

let state = 'idle', t = 0, ph = 0, spin = 0, last = performance.now();
const P = { speed: .6, deform: .015, think: 0, amp: 0, scale: 1 };
COLORS.forEach(k => P[k] = hex(S.idle[k]));
let voice = { t: 0, v: 0 };

// Nubes que flotan dentro del orbe
const blobs = [
  { c: 'mid',   r: .95, fx: .7, fy: .9,  o: 0,   a: .9 },
  { c: 'light', r: .6,  fx: 1.1, fy: .6, o: 2,   a: .7 },
  { c: 'mid',   r: .75, fx: .5, fy: 1.3, o: 4,   a: .8 },
  { c: 'light', r: .45, fx: 1.4, fy: 1,  o: 1.3, a: .6 },
  { c: 'deep',  r: .7,  fx: .9, fy: .4,  o: 5,   a: .9 },
];

function shape(cx, cy, r, def) {
  ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const a = i / 120 * Math.PI * 2;
    const k = 1 + def * (Math.sin(3 * a + t * 1.3) * .5 + Math.sin(5 * a - t * 1.9 + 1) * .3 + Math.sin(2 * a + t * .8 + 2) * .4);
    const x = cx + Math.cos(a) * r * k, y = cy + Math.sin(a) * r * k;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

// Cara: ojos grandes + gafas redondas
const FACE = {
  idle:      { happy: .45, tilt: 0   },
  listening: { happy: .25, tilt: .06 },
  speaking:  { happy: .5,  tilt: 0   },
  thinking:  { happy: 0,   tilt: -.1 },
};
const F = { ...FACE.idle, gx: 0, gy: 0 };
let gaze = { x: 0, y: 0 }, sacT = 0, blinkIn = 2, blinkT = -1, joyT = 0;

function eye(x, y, er, lid, happy, gx, gy, mirror) {
  ctx.save();
  // Párpado inferior "sonriente": recorta la parte de abajo del ojo con un círculo
  ctx.beginPath(); ctx.rect(x - er * 2, y - er * 2, er * 4, er * 4);
  ctx.arc(x, y + er * (2.15 - happy * 1.35), er * 1.3, 0, Math.PI * 2); ctx.clip('evenodd');
  ctx.beginPath(); ctx.ellipse(x, y, er, er * 1.08 * lid, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#fbfcff'; ctx.fillRect(x - er, y - er * 1.2, er * 2, er * 2.4);
  const ix = x + gx * er * .38, iy = y + gy * er * .3, ir = er * .6;
  const ig = ctx.createRadialGradient(ix, iy - ir * .3, 0, ix, iy, ir);
  ig.addColorStop(0, rgba(P.mid.map(v => v * .55), 1)); ig.addColorStop(.7, '#140d33'); ig.addColorStop(1, '#0b0720');
  ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(ix, iy, ir, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#05030f'; ctx.beginPath(); ctx.arc(ix, iy, ir * .48, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ix + ir * .35 * mirror, iy - ir * .38, ir * .3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ix - ir * .35 * mirror, iy + ir * .35, ir * .13, 0, Math.PI * 2); ctx.fill();
  // Sombra superior del párpado
  const sg = ctx.createLinearGradient(0, y - er, 0, y - er * .3);
  sg.addColorStop(0, 'rgba(20,15,60,.35)'); sg.addColorStop(1, 'rgba(20,15,60,0)');
  ctx.fillStyle = sg; ctx.fillRect(x - er, y - er * 1.2, er * 2, er);
  ctx.restore();
}

function drawFace(cx, cy, r, dt) {
  const T = FACE[state];
  for (const k in T) F[k] = lerp(F[k], T[k], .1);

  // Mirada
  if ((sacT -= dt) <= 0) {
    sacT = rand(.9, 2.8);
    gaze = state === 'thinking' ? { x: rand(.6, .9), y: rand(-.9, -.7) }
         : state === 'idle'     ? { x: rand(-.6, .6), y: rand(-.3, .3) }
         :                        { x: rand(-.15, .15), y: rand(-.1, .1) };
  }
  F.gx = lerp(F.gx, gaze.x, .2); F.gy = lerp(F.gy, gaze.y, .2);

  // Parpadeo (a veces doble)
  if ((blinkIn -= dt) <= 0) { blinkT = 0; blinkIn = Math.random() < .2 ? .25 : rand(2.2, 5); }
  let lid = 1;
  if (blinkT >= 0) { blinkT += dt; if (blinkT < .16) lid = 1 - .92 * Math.sin(blinkT / .16 * Math.PI); else blinkT = -1; }

  // En reposo, de vez en cuando sonríe con los ojos (^ ^)
  if (state === 'idle' && (joyT -= dt) <= 0) joyT = rand(4, 8);
  const joy = state === 'idle' && joyT < 1.1 ? Math.sin(joyT / 1.1 * Math.PI) : 0;
  const happy = Math.min(1, F.happy + joy * .6 + (state === 'speaking' ? P.amp * .25 : 0));

  const nod = state === 'listening' ? ((Math.sin(t * 2.4) * .5 + .5) ** 6) * r * .04 : 0;
  ctx.save();
  ctx.translate(cx + F.gx * r * .07, cy - r * .02 + F.gy * r * .05 + nod);
  ctx.rotate(F.tilt + Math.sin(t * .8) * .02);

  const ex = r * .31, ey = 0, er = r * .19, gr = r * .27;

  eye(-ex, ey, er, lid, happy, F.gx, F.gy, 1);
  eye(ex, ey, er, lid, happy, F.gx, F.gy, 1);

  // Gafas
  const ink = '#120d2a';
  ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    ctx.fillStyle = 'rgba(200,225,255,.07)';
    ctx.beginPath(); ctx.arc(s * ex, ey, gr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = r * .045;
    ctx.beginPath(); ctx.arc(s * ex, ey, gr, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = r * .018;           // reflejo
    ctx.beginPath(); ctx.arc(s * ex, ey, gr * .78, Math.PI * 1.1, Math.PI * 1.38); ctx.stroke();
    ctx.strokeStyle = ink; ctx.lineWidth = r * .04;                             // patillas
    ctx.beginPath(); ctx.moveTo(s * (ex + gr), ey - gr * .15); ctx.lineTo(s * (ex + gr + r * .12), ey - gr * .3); ctx.stroke();
  }
  ctx.strokeStyle = ink; ctx.lineWidth = r * .04;                               // puente
  ctx.beginPath(); ctx.moveTo(-ex + gr, ey - gr * .05); ctx.quadraticCurveTo(0, ey - gr * .45, ex - gr, ey - gr * .05); ctx.stroke();

  ctx.restore();
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt * calm;
  const T = S[state];
  ['speed', 'deform', 'think'].forEach(k => P[k] = lerp(P[k], T[k], .05));
  COLORS.forEach(k => { const tc = hex(T[k]); P[k] = P[k].map((v, i) => lerp(v, tc[i], .05)); });

  // Voz simulada. En producción: amplitud real (AnalyserNode del audio de Rita o del micro).
  if (state === 'speaking' || state === 'listening') {
    if ((voice.t -= dt) <= 0) voice = Math.random() < .14 ? { v: 0, t: rand(.15, .4) } : { v: rand(.3, 1), t: rand(.07, .18) };
  } else voice.v = 0;
  P.amp = lerp(P.amp, voice.v, .18);

  ph += dt * P.speed * calm; spin += dt * (.4 + P.think * 2.2) * calm;
  const target = state === 'speaking' ? 1 + P.amp * .14
               : state === 'listening' ? 1 + P.amp * .08
               : state === 'thinking' ? .94 + Math.sin(t * 2.2) * .025
               : 1 + Math.sin(t * 1.4) * .015;
  P.scale = lerp(P.scale, target, .15);

  const float = Math.sin(t * 1.1) * 8, cx = C, cy = C - 10 + float, r = R * P.scale;
  const def = P.deform + P.amp * .06;
  ctx.clearRect(0, 0, SIZE, SIZE);

  // Sombra en el "suelo": más pequeña cuando el orbe sube
  const sh = ctx.createRadialGradient(C, C + R + 52, 0, C, C + R + 52, R);
  sh.addColorStop(0, rgba(P.glow, .28 - float * .012)); sh.addColorStop(1, rgba(P.glow, 0));
  ctx.save(); ctx.translate(C, C + R + 52); ctx.scale(1 - float * .01, .16); ctx.translate(-C, -(C + R + 52));
  ctx.fillStyle = sh; ctx.fillRect(0, 0, SIZE, SIZE); ctx.restore();

  // Halo
  ctx.save(); ctx.shadowColor = rgba(P.glow, .55 + P.amp * .35); ctx.shadowBlur = 50 + P.amp * 40;
  shape(cx, cy, r, def); ctx.fillStyle = rgba(P.deep, 1); ctx.fill(); ctx.restore();

  // Cuerpo
  ctx.save(); shape(cx, cy, r, def); ctx.clip();
  const base = ctx.createRadialGradient(cx, cy + r * .3, 0, cx, cy, r * 1.1);
  base.addColorStop(0, rgba(P.mid, 1)); base.addColorStop(1, rgba(P.deep, 1));
  ctx.fillStyle = base; ctx.fillRect(0, 0, SIZE, SIZE);

  ctx.globalCompositeOperation = 'screen';
  for (const b of blobs) {
    const bx = cx + Math.cos(ph * b.fx + b.o) * r * .5, by = cy + Math.sin(ph * b.fy + b.o * 1.7) * r * .45;
    const br = r * b.r * (1 + P.amp * .2);
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, br);
    g.addColorStop(0, rgba(P[b.c], b.a)); g.addColorStop(1, rgba(P[b.c], 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, SIZE, SIZE);
  }

  // Pensando: remolino de luz que gira dentro
  if (P.think > .01 && ctx.createConicGradient) {
    const cg = ctx.createConicGradient(spin, cx, cy);
    cg.addColorStop(0, rgba(P.light, 0)); cg.addColorStop(.15, rgba(P.light, .55 * P.think));
    cg.addColorStop(.35, rgba(P.light, 0)); cg.addColorStop(.6, rgba(P.mid, .4 * P.think)); cg.addColorStop(.8, rgba(P.light, 0));
    cg.addColorStop(1, rgba(P.light, 0));
    ctx.fillStyle = cg; ctx.fillRect(0, 0, SIZE, SIZE);
  }

  // Volumen: sombra en el borde + brillo superior
  ctx.globalCompositeOperation = 'source-over';
  const edge = ctx.createRadialGradient(cx, cy, r * .55, cx, cy, r * 1.05);
  edge.addColorStop(0, 'rgba(5,8,30,0)'); edge.addColorStop(1, 'rgba(5,8,30,.45)');
  ctx.fillStyle = edge; ctx.fillRect(0, 0, SIZE, SIZE);
  drawFace(cx, cy, r, dt);
  const hl = ctx.createRadialGradient(cx - r * .5, cy - r * .62, 0, cx - r * .5, cy - r * .62, r * .45);
  hl.addColorStop(0, 'rgba(255,255,255,.4)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hl; ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.restore();

  // Borde fino
  shape(cx, cy, r, def); ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1.2; ctx.stroke();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function setState(s) {
  state = s; $('label').textContent = LABEL[s];
  document.querySelectorAll('.controls button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
}
document.querySelectorAll('.controls button').forEach(b => b.onclick = () => setState(b.dataset.s));
window.rita = { setState }; // rita.setState('speaking' | 'listening' | 'thinking' | 'idle')
</script>
</body>
</html>
