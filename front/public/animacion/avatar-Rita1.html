<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rita - avatar de voz</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:radial-gradient(circle at 50% 30%, #15122a, #050507 70%);
         font-family:system-ui,sans-serif; color:#fff; }
  .call { display:flex; flex-direction:column; align-items:center; gap:10px; padding:28px 36px 32px;
          border-radius:32px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
          backdrop-filter:blur(20px); }
  #rita { width:380px; height:380px; overflow:visible; }
  h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:.3px; }
  .status { margin:0; display:flex; align-items:center; gap:8px; color:#bbb; font-size:14px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#5ee0b0; transition:background .3s; }
  [data-state="listening"] .dot { background:#5cc8ff; }
  [data-state="speaking"]  .dot { background:#ff7a66; }
  [data-state="thinking"]  .dot { background:#8b7bff; }
  .controls { margin-top:14px; display:flex; gap:8px; }
  .controls button { background:#14141b; color:#fff; border:1px solid #8b7bff44; padding:9px 16px;
                     border-radius:999px; cursor:pointer; font-size:13px; transition:background .2s; }
  .controls button.on { background:#8b7bff; border-color:#8b7bff; }
</style>
</head>
<body>
<main class="call" id="call" data-state="idle">
<svg id="rita" viewBox="0 0 400 400" role="img" aria-label="Rita, asistente de voz">
  <defs>
    <radialGradient id="card" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#211a3d"/><stop offset="1" stop-color="#0a0912"/></radialGradient>
    <radialGradient id="warm"><stop offset="0" stop-color="#ff7a66"/><stop offset=".5" stop-color="#8b7bff"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool"><stop offset="0" stop-color="#5cc8ff"/><stop offset=".5" stop-color="#3d6bff"/><stop offset="1" stop-color="#3d6bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="aurora" x1="0" x2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset=".55" stop-color="#ff7a66"/><stop offset="1" stop-color="#ffb86b"/></linearGradient>
    <radialGradient id="skin" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="#f9d6bd"/><stop offset="1" stop-color="#e7a989"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d2553"/><stop offset="1" stop-color="#1d0e24"/></linearGradient>
    <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#3424a0"/></linearGradient>
    <radialGradient id="iris" cx="50%" cy="35%"><stop offset="0" stop-color="#a68cff"/><stop offset=".6" stop-color="#5a3cc8"/><stop offset="1" stop-color="#26175a"/></radialGradient>
    <filter id="b3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="cardClip"><circle cx="200" cy="200" r="150"/></clipPath>
    <path id="faceShape" d="M200 118 C245 118 262 150 260 190 C258 228 232 258 200 260 C168 258 142 228 140 190 C138 150 155 118 200 118 Z"/>
    <clipPath id="faceClip"><use href="#faceShape"/></clipPath>
    <path id="eyeShape" d="M-14 0 Q0 -12 14 0 Q0 9 -14 0 Z"/>
    <clipPath id="eyeClip"><use href="#eyeShape"/></clipPath>
    <path id="mouthShape" d="M187 229 Q200 231 213 229 Q200 234 187 229 Z"/>
    <clipPath id="mouthClip"><use href="#mouthShape"/></clipPath>
    <path id="bangs" d="M136 185 C128 120 160 92 204 94 C246 96 272 126 264 186 C258 160 248 140 232 128 C214 142 182 150 150 148 C144 160 140 172 136 185 Z"/>
    <g id="eye">
      <use href="#eyeShape" fill="#fff"/>
      <g clip-path="url(#eyeClip)"><g class="iris">
        <circle r="7.5" fill="url(#iris)"/><circle r="3.6" fill="#120a24"/>
        <circle cx="2.6" cy="-2.6" r="2.1" fill="#fff"/><circle cx="-2.2" cy="2.2" r="1" fill="#fff" opacity=".7"/>
      </g></g>
      <path d="M-15.5 .5 Q0 -13.5 15.5 -1" fill="none" stroke="#1d1028" stroke-width="3" stroke-linecap="round"/>
      <path d="M-14 -.5 L-19.5 -5" stroke="#1d1028" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>

  <g id="bars"></g>
  <circle id="glowWarm" cx="200" cy="200" r="140" fill="url(#warm)" filter="url(#b24)" opacity=".35"/>
  <circle id="glowCool" cx="200" cy="200" r="140" fill="url(#cool)" filter="url(#b24)" opacity="0"/>
  <circle cx="200" cy="200" r="150" fill="url(#card)"/>
  <g id="orbsBack"></g>

  <g clip-path="url(#cardClip)">
    <ellipse cx="200" cy="370" rx="170" ry="60" fill="url(#aurora)" filter="url(#b24)" opacity=".45"/>
    <g id="bodyAll">
      <g id="hairBack"><path d="M138 180 C130 110 165 90 200 90 C238 90 272 112 264 182 C262 238 278 280 300 330 L100 330 C122 280 140 238 138 180 Z" fill="url(#hair)"/></g>
      <g>
        <path d="M183 236 L183 280 Q200 294 217 280 L217 236 Z" fill="#e8ab8a"/>
        <path d="M183 246 Q200 268 217 246 L217 258 Q200 276 183 258 Z" fill="#c9846a" opacity=".55"/>
        <path d="M80 360 C86 300 136 280 180 274 Q200 292 220 274 C264 280 314 300 320 360 Z" fill="url(#sweater)"/>
        <path d="M176 272 Q200 302 224 272 L230 278 Q200 314 170 278 Z" fill="#b0a4ff"/>
      </g>
      <g id="locks" fill="url(#hair)">
        <path d="M142 200 C138 248 130 286 116 326 C134 320 150 304 156 282 C154 252 152 226 152 206 Z"/>
        <path d="M258 200 C262 248 270 286 284 326 C266 320 250 304 244 282 C246 252 248 226 248 206 Z"/>
      </g>
      <g id="headFront">
        <use href="#faceShape" fill="url(#skin)"/>
        <g clip-path="url(#faceClip)"><use href="#bangs" fill="#c27c62" opacity=".35" transform="translate(0 6)" filter="url(#b3)"/></g>
        <ellipse cx="166" cy="214" rx="11" ry="6" fill="#ff7a66" opacity=".3" filter="url(#b3)"/>
        <ellipse cx="234" cy="214" rx="11" ry="6" fill="#ff7a66" opacity=".3" filter="url(#b3)"/>
        <g transform="translate(174 190)"><g id="lidL"></g></g>
        <g transform="translate(226 190) scale(-1 1)"><g id="lidR"></g></g>
        <path id="browL" d="M160 173 Q173 164 188 170" stroke="#2b1530" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path id="browR" d="M212 170 Q227 164 240 173" stroke="#2b1530" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M198 200 Q195 211 199 214 Q203 215.5 206 213" stroke="#c98468" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <use href="#mouthShape" fill="#4a1526"/>
        <g clip-path="url(#mouthClip)">
          <rect x="185" y="225" width="30" height="6" rx="2" fill="#fff"/>
          <ellipse cx="200" cy="243" rx="9" ry="6" fill="#e06b7c"/>
        </g>
        <use href="#mouthShape" fill="none" stroke="#c45a6e" stroke-width="2.2" stroke-linejoin="round"/>
        <use href="#bangs" fill="url(#hair)"/>
        <path d="M168 104 Q200 96 232 106" stroke="#7a3f7f" stroke-width="5" opacity=".55" fill="none" stroke-linecap="round"/>
        <path d="M226 132 Q196 150 158 148" stroke="#6a3470" stroke-width="2" opacity=".6" fill="none"/>
        <circle cx="138" cy="208" r="2.6" fill="#ffb86b"/><circle cx="262" cy="208" r="2.6" fill="#ffb86b"/>
        <!-- Cascos -->
        <path d="M140 184 C136 72 264 72 260 184" fill="none" stroke="#17161f" stroke-width="7" stroke-linecap="round"/>
        <path d="M141 180 C138 78 262 78 259 180" fill="none" stroke="#3d3b52" stroke-width="2"/>
        <rect x="127" y="168" width="20" height="34" rx="9" fill="#1c1b26"/>
        <rect x="253" y="168" width="20" height="34" rx="9" fill="#1c1b26"/>
        <rect class="cup" x="130" y="176" width="5" height="18" rx="2.5" fill="#8b7bff"/>
        <rect class="cup" x="265" y="176" width="5" height="18" rx="2.5" fill="#8b7bff"/>
        <path d="M264 198 C265 232 246 246 228 242" stroke="#1c1b26" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="225" cy="241.5" r="5" fill="#2a2938"/>
        <circle id="mic" cx="225" cy="241.5" r="7" fill="#ffb86b" filter="url(#b3)" opacity=".2"/>
      </g>
    </g>
  </g>

  <g id="orbsFront"></g>
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#aurora)" stroke-opacity=".25"/>
</svg>

<h1>Rita</h1>
<p class="status"><span class="dot"></span><span id="label">En línea</span></p>
<div class="controls">
  <button data-s="idle" class="on">Reposo</button>
  <button data-s="listening">Escuchando</button>
  <button data-s="speaking">Hablando</button>
  <button data-s="thinking">Pensando</button>
</div>
</main>

<script>
const NS = 'http://www.w3.org/2000/svg', $ = id => document.getElementById(id);
const lerp = (a, b, k) => a + (b - a) * k, rand = (a, b) => a + Math.random() * (b - a);
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches ? .3 : 1;

const PRESETS = {
  idle:      { tilt: 0,  brow: 0,   browR: 0,  smile: 1,   w: 1,   mx: 0, orbs: 0, warm: .35, cool: .05 },
  listening: { tilt: 3,  brow: .4,  browR: .4, smile: .7,  w: 1,   mx: 0, orbs: 0, warm: .12, cool: .55 },
  speaking:  { tilt: 0,  brow: .2,  browR: .2, smile: .6,  w: 1,   mx: 0, orbs: 0, warm: .5,  cool: .1  },
  thinking:  { tilt: -7, brow: -.1, browR: .9, smile: -.2, w: .65, mx: 5, orbs: 1, warm: .3,  cool: .35 },
};
const LABEL = { idle: 'En línea', listening: 'Te escucho…', speaking: 'Hablando…', thinking: 'Pensando…' };

// Ojos: copia real (no <use>) para mover cada iris por separado
for (const id of ['lidL', 'lidR']) for (const n of $('eye').children) $(id).appendChild(n.cloneNode(true));

// Ecualizador circular
const PAL = ['#8b7bff', '#e07bff', '#ff7a66', '#ffb86b', '#5cc8ff', '#3d6bff', '#8b7bff'];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const colorAt = u => { const p = u * (PAL.length - 1), i = Math.floor(p), k = p - i, a = hex(PAL[i]), b = hex(PAL[i + 1] || PAL[i]);
  return `rgb(${a.map((v, j) => Math.round(v + (b[j] - v) * k))})`; };
const N = 72, bars = [];
for (let i = 0; i < N; i++) {
  const el = document.createElementNS(NS, 'line');
  el.setAttribute('stroke', colorAt(i / N)); el.setAttribute('stroke-width', 3); el.setAttribute('stroke-linecap', 'round');
  $('bars').appendChild(el); bars.push({ el, a: i / N * Math.PI * 2 - Math.PI / 2, len: 3 });
}

// Orbes que orbitan al pensar
const orbs = [0, 1, 2].map(i => {
  const g = document.createElementNS(NS, 'g');
  g.innerHTML = '<circle r="10" fill="#8b7bff" opacity=".45" filter="url(#b3)"/><circle r="3.4" fill="#fff"/>';
  $('orbsBack').appendChild(g); return { g, off: i * Math.PI * 2 / 3 };
});

let state = 'idle', t = 0, last = performance.now();
const P = { ...PRESETS.idle, gx: 0, gy: 0, amp: 0, user: 0, mw: 1 };
let gaze = { x: 0, y: 0 }, sacT = 0, blinkIn = 2, blinkT = -1, syl = { t: 0, v: 0, w: 1 }, usr = { t: 0, v: 0 };

function mouth(open, w, smile, mx) {
  const cx = 200 + mx, y = 229, hw = 13 * w * (1 - open * .18), cy = y - smile * 3;
  const up = y + smile * 1.2 - open * 3, lo = y + 1.5 + smile * 3 + open * 20;
  return `M${cx - hw} ${cy} Q${cx} ${up} ${cx + hw} ${cy} Q${cx} ${lo} ${cx - hw} ${cy} Z`;
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  const S = PRESETS[state];
  for (const k in S) P[k] = lerp(P[k], S[k], .08);

  // Voz simulada (sílabas y pausas). En producción: amplitud real del audio.
  if (state === 'speaking') { if ((syl.t -= dt) <= 0) Math.random() < .13
      ? Object.assign(syl, { v: 0, t: rand(.15, .4) })
      : Object.assign(syl, { v: rand(.3, 1), w: rand(.75, 1.2), t: rand(.07, .16) }); } else syl.v = 0;
  if (state === 'listening') { if ((usr.t -= dt) <= 0) Object.assign(usr, { v: Math.random() < .15 ? 0 : rand(.2, 1), t: rand(.08, .2) }); } else usr.v = 0;
  P.amp = lerp(P.amp, syl.v, .3); P.user = lerp(P.user, usr.v, .25);
  P.mw = lerp(P.mw, state === 'speaking' ? syl.w : 1, .2);

  // Mirada y parpadeo
  if ((sacT -= dt) <= 0) {
    sacT = rand(.8, 2.6);
    gaze = state === 'thinking' ? { x: rand(3, 5), y: rand(-5, -3.5) }
         : state === 'idle'     ? { x: rand(-3, 3), y: rand(-1.5, 1.5) }
         :                        { x: rand(-1, 1), y: rand(-.5, .5) };
  }
  P.gx = lerp(P.gx, gaze.x, .25); P.gy = lerp(P.gy, gaze.y, .25);
  if ((blinkIn -= dt) <= 0) { blinkT = 0; blinkIn = Math.random() < .2 ? .22 : rand(2, 5.5); }
  let lid = 1;
  if (blinkT >= 0) { blinkT += dt; if (blinkT < .17) lid = 1 - .95 * Math.sin(blinkT / .17 * Math.PI); else blinkT = -1; }
  if (state === 'thinking') lid *= .88;

  // Cabeza
  const breathe = Math.sin(t * 1.7) * 1.3;
  const sway = Math.sin(t * .7) * 1.5 + Math.sin(t * 1.3) * .7;
  const nod = state === 'speaking' ? P.amp * 3 : state === 'listening' ? ((Math.sin(t * 2.4) * .5 + .5) ** 6) * 4 : 0;
  const tilt = (P.tilt + sway * .6) * calm, nx = Math.sin(t * .5) * 1.5 * calm, ny = nod * calm;
  const head = `translate(${nx} ${ny}) rotate(${tilt} 200 255)`;
  $('bodyAll').setAttribute('transform', `translate(0 ${breathe * .6 * calm})`);
  $('headFront').setAttribute('transform', head);
  $('locks').setAttribute('transform', `translate(${nx} ${ny}) rotate(${tilt * .7} 200 255)`);
  $('hairBack').setAttribute('transform', `translate(${nx} ${ny}) rotate(${tilt * .85 + Math.sin(t * .7 - .6) * calm} 200 200)`);

  // Cara
  $('lidL').setAttribute('transform', `scale(1 ${lid})`);
  $('lidR').setAttribute('transform', `scale(1 ${lid})`);
  document.querySelectorAll('#lidL .iris').forEach(e => e.setAttribute('transform', `translate(${P.gx} ${P.gy})`));
  document.querySelectorAll('#lidR .iris').forEach(e => e.setAttribute('transform', `translate(${-P.gx} ${P.gy})`));
  const emph = state === 'speaking' ? P.amp * .6 : 0;
  $('browL').setAttribute('transform', `translate(0 ${-(P.brow + emph) * 4})`);
  $('browR').setAttribute('transform', `translate(0 ${-(P.browR + emph) * 4})`);
  $('mouthShape').setAttribute('d', mouth(P.amp, P.w * P.mw, P.smile, P.mx));
  $('mic').setAttribute('opacity', .15 + P.amp * .85);
  document.querySelectorAll('.cup').forEach(e => e.setAttribute('opacity', .35 + P.cool + P.amp * .5));

  // Aura
  $('glowWarm').setAttribute('opacity', P.warm + P.amp * .4 + Math.sin(t * 1.7) * .04);
  $('glowCool').setAttribute('opacity', P.cool + P.user * .35);

  // Ecualizador
  bars.forEach((b, i) => {
    let L;
    if (state === 'speaking') L = 3 + P.amp * 26 * (.35 + .65 * Math.abs(Math.sin(i * .9 + t * 11) * Math.cos(i * .37 - t * 7)));
    else if (state === 'listening') L = 3 + P.user * 18 * (.35 + .65 * Math.abs(Math.sin(i * 1.3 - t * 9) * Math.cos(i * .21 + t * 6)));
    else if (state === 'thinking') { let d = (((b.a - t * 3.2) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2); d = Math.min(d, Math.PI * 2 - d); L = 3 + 18 * Math.exp(-d * d / .25); }
    else L = 3 + 2 * Math.sin(t * 2 + i * .35);
    b.len = lerp(b.len, L, .25);
    const c = Math.cos(b.a), s = Math.sin(b.a), r = 160;
    b.el.setAttribute('x1', 200 + c * r); b.el.setAttribute('y1', 200 + s * r);
    b.el.setAttribute('x2', 200 + c * (r + b.len)); b.el.setAttribute('y2', 200 + s * (r + b.len));
  });

  // Orbes (pasan por delante y por detrás de la cabeza)
  orbs.forEach(o => {
    const a = t * 1.9 + o.off, s = Math.sin(a), depth = (s + 1) / 2;
    const x = 200 + Math.cos(a) * 96 + nx, y = 126 + s * 18 - Math.cos(a) * 8 + ny;
    o.g.setAttribute('transform', `translate(${x} ${y}) scale(${.6 + .5 * depth})`);
    o.g.setAttribute('opacity', P.orbs * (.45 + .55 * depth));
    const parent = s > 0 ? $('orbsFront') : $('orbsBack');
    if (o.g.parentNode !== parent) parent.appendChild(o.g);
  });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function setState(s) {
  state = s; sacT = 0;
  $('call').dataset.state = s; $('label').textContent = LABEL[s];
  document.querySelectorAll('.controls button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
}
document.querySelectorAll('.controls button').forEach(b => b.onclick = () => setState(b.dataset.s));
window.rita = { setState }; // rita.setState('speaking' | 'listening' | 'thinking' | 'idle')
</script>
</body>
</html>
