[project]
name = "sazon-back"
version = "0.1.0"
description = "Grupo Sazon screening agent API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "rapidfuzz>=3.10",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "openai>=1.54",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
